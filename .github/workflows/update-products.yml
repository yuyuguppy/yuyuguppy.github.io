name: 更新 AI 可讀商品頁

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-products
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 讀取網站檔案
        uses: actions/checkout@v4

      - name: 從 Google Sheet 產生靜態商品頁
        run: >-
          python3 scripts/build_products.py
          --csv-url "https://docs.google.com/spreadsheets/d/1a0w_rwgHkmewRXDZ1nG1Tiito3qaK9huNO7xzOmc0BI/export?format=csv"
          --fish fish.html
          --site-root .

      - name: 發布有變更的商品資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fish.html products sitemap.xml
          if git diff --cached --quiet; then
            echo "商品資料沒有變更"
          else
            git commit -m "自動更新商品頁與網站地圖"
            git push
          fi

