name: One-time About SEO fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-about-seo.yml'

permissions:
  contents: write

jobs:
  patch-about:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch About H1 and remove JS SEO workaround
        run: |
          python - <<'PY'
          from pathlib import Path

          about = Path('about.html')
          text = about.read_text(encoding='utf-8')
          old = '<div class="main-headline">三合院裡的水族夢<br>與你分享養魚的快樂</div>'
          new = '<h1 class="main-headline">三合院裡的水族夢<br>與你分享養魚的快樂</h1>'
          if old not in text:
              raise SystemExit('Expected About headline was not found; refusing to modify.')
          about.write_text(text.replace(old, new, 1), encoding='utf-8')

          menu = Path('yuyu-menu.js')
          js = menu.read_text(encoding='utf-8')
          start_marker = '    /* SEO：about.html 原本主視覺標題是 div，補成真正 H1；同時讓標題更貼近目前 GSC 已有排名的在地搜尋意圖。 */\n'
          end_marker = '    const font = document.createElement(\'link\');\n'
          start = js.find(start_marker)
          end = js.find(end_marker)
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('Expected About JS workaround block was not found; refusing to modify.')
          js = js[:start] + js[end:]
          menu.write_text(js, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-about-seo.yml

      - name: Commit SEO cleanup
        run: |
          git config user.name "yuyuguppy"
          git config user.email "jeffreyyu86@gmail.com"
          git add about.html yuyu-menu.js .github/workflows/one-time-about-seo.yml
          git commit -m "改為 About 靜態 H1 並移除 JS SEO workaround"
          git push