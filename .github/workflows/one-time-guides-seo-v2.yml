name: One-time Guides SEO cleanup v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-guides-seo-v2.yml

permissions:
  contents: write

jobs:
  patch-guides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply SEO patch
        run: python -c "import base64;exec(base64.b64decode('').decode('utf-8'))"
      - name: Remove workflow
        run: rm .github/workflows/one-time-guides-seo-v2.yml
      - name: Commit changes
        run: |
          git config user.name "yuyuguppy"
          git config user.email "jeffreyyu86@gmail.com"
          git add guides/guppy-care.html guides/betta-care.html guides/guppy-symptoms.html guides/index.html .github/workflows/one-time-guides-seo-v2.yml
          git commit -m "修正文章結構化資料並補強養魚知識庫"
          git push
